name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/lzguimaraes/wushu-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "==> [1/3] Baixando a imagem"
            docker pull ${{ env.IMAGE }}:latest

            echo "==> [2/3] Recriando o container web"
            docker rm -f web || true
            docker run -d --name web \
              --network kungfu-net \
              --restart unless-stopped \
              -l 'traefik.enable=true' \
              -l 'traefik.http.routers.web.rule=Host(`${{ vars.DOMAIN_WEB }}`)' \
              -l 'traefik.http.routers.web.entrypoints=${{ vars.TRAEFIK_ENTRYPOINT }}' \
              -l 'traefik.http.routers.web.tls.certresolver=${{ vars.TRAEFIK_CERTRESOLVER }}' \
              -l 'traefik.http.services.web.loadbalancer.server.port=80' \
              ${{ env.IMAGE }}:latest

            echo "==> [3/3] Status do container"
            sleep 3
            docker ps --filter name=web --format 'table {{.Names}}\t{{.Status}}'

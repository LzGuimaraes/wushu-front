<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="功夫">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="50%" stop-color="#e8a33c"/>
      <stop offset="100%" stop-color="#c97d16"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fundo escuro: remova esta linha se quiser fundo transparente -->
  <rect width="200" height="200" rx="28" fill="#0e0e0e"/>

  <g filter="url(#glow)">
    <!-- anel -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold)" stroke-width="6.5"/>

    <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <!-- 功 -->
      <g transform="translate(44,74) scale(0.52)">
        <path d="M6,32 H44"/>
        <path d="M25,32 V68"/>
        <path d="M6,72 L46,64"/>
        <path d="M52,30 H86 V64 Q86,74 75,75"/>
        <path d="M60,30 C57,48 54,62 44,78"/>
      </g>
      <!-- 夫 -->
      <g transform="translate(104,74) scale(0.52)">
        <path d="M22,32 H78"/>
        <path d="M10,56 H90"/>
        <path d="M58,12 C55,36 52,48 44,62 C38,74 33,80 24,88"/>
        <path d="M48,54 C56,66 64,76 80,88"/>
      </g>
    </g>
  </g>
</svg>
